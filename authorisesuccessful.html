<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Success Modal with Loader</title>
    <!-- Importing a modern font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS Variables --- */
        :root {
            --primary-green: #36b16e;
            --primary-green-hover: #2a8a56;
            --text-dark: #1f2937;
            --text-muted: #6b7280;
            --bg-white: #ffffff;
            --overlay-bg: rgba(17, 24, 39, 0.4);
        }

        /* --- Base Reset --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* Simulating a background page behind the popup */
            background-image: radial-gradient(#d1d5db 1px, transparent 1px);
            background-size: 20px 20px;
        }

        /* --- Modal Overlay (Background) --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--overlay-bg);
            backdrop-filter: blur(4px); /* Creates the glass effect */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        /* --- Modal Card --- */
        .modal-card {
            background-color: var(--bg-white);
            width: 100%;
            max-width: 420px;
            border-radius: 16px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.15), 0 0 20px rgba(0,0,0,0.05);
            overflow: hidden;
            text-align: center;
            transform: translateY(30px) scale(0.95);
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0) scale(1);
            opacity: 1;
        }

        /* --- Top Green Section --- */
        .card-header {
            background-color: var(--primary-green);
            padding: 50px 30px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        /* SVG Checkmark Animation */
        .icon-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }

        .checkmark-svg {
            width: 80px;
            height: 80px;
            stroke: #ffffff;
            stroke-width: 3;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .checkmark-circle {
            stroke-dasharray: 166;
            stroke-dashoffset: 166;
            stroke-width: 3;
            stroke-miterlimit: 10;
            stroke: #ffffff;
        }

        .checkmark-check {
            transform-origin: 50% 50%;
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
        }

        /* Trigger animations when modal opens */
        .modal-overlay.active .checkmark-circle {
            animation: stroke 0.6s cubic-bezier(0.65, 0, 0.45, 1) forwards;
        }

        .modal-overlay.active .checkmark-check {
            animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.6s forwards;
        }

        @keyframes stroke {
            100% { stroke-dashoffset: 0; }
        }

        .card-header h1 {
            color: #ffffff;
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
            opacity: 0;
            transform: translateY(10px);
        }

        .modal-overlay.active .card-header h1 {
            animation: fadeUp 0.5s ease 0.8s forwards;
        }

        /* --- Bottom White Section --- */
        .card-body {
            padding: 35px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .message {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
            opacity: 0;
            transform: translateY(10px);
        }

        .modal-overlay.active .message {
            animation: fadeUp 0.5s ease 0.9s forwards;
        }

        /* Text Link */
        .text-link {
            color: var(--primary-green);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            transition: color 0.2s ease;
            margin-bottom: 25px;
            cursor: pointer;
            opacity: 0;
            transform: translateY(10px);
        }

        .modal-overlay.active .text-link {
            animation: fadeUp 0.5s ease 1.0s forwards;
        }

        .text-link:hover {
            color: var(--primary-green-hover);
            text-decoration: underline;
        }

        /* Continue Button */
        .continue-btn {
            background-color: var(--primary-green);
            color: #ffffff;
            text-decoration: none;
            padding: 14px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50px; /* Fixed height to prevent jumping when spinner appears */
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(54, 177, 110, 0.2);
            opacity: 0;
            transform: translateY(10px);
            cursor: pointer;
        }

        .modal-overlay.active .continue-btn {
            animation: fadeUp 0.5s ease 1.1s forwards;
        }

        .continue-btn:hover {
            background-color: var(--primary-green-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(54, 177, 110, 0.3);
        }

        .continue-btn:active {
            transform: translateY(0);
            box-shadow: 0 2px 4px rgba(54, 177, 110, 0.2);
        }

        /* --- Loader Styles --- */
        .spinner {
            display: none;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffffff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* State when button is loading */
        .continue-btn.loading {
            pointer-events: none; /* Disable clicks */
            background-color: var(--primary-green-hover);
        }

        .continue-btn.loading .btn-text {
            display: none;
        }

        .continue-btn.loading .spinner {
            display: block;
        }

        /* Keyframes for staggered text reveal */
        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Button to re-open the modal (for demonstration) */
        .trigger-btn {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 500;
            background-color: var(--text-dark);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .trigger-btn:hover { background-color: #374151; }

        /* Responsive */
        @media (max-width: 480px) {
            .modal-card {
                border-radius: 0;
                height: 100%;
                max-width: 100%;
                display: flex;
                flex-direction: column;
                justify-content: center;
                transform: translateY(100%); /* Slide up from bottom on mobile */
            }
            .modal-overlay.active .modal-card {
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <!-- Background Demo Button -->
    <button class="trigger-btn" id="openModalBtn"></button>

    <!-- Modal Overlay -->
    <div class="modal-overlay" id="successModal">
        
        <!-- Modal Card -->
        <div class="modal-card">
            
            <!-- Header -->
            <div class="card-header">
                <div class="icon-circle">
                    <!-- Animated SVG Checkmark -->
                    <svg class="checkmark-svg" viewBox="0 0 52 52">
                        <circle class="checkmark-circle" cx="26" cy="26" r="25" fill="none"/>
                        <path class="checkmark-check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
                    </svg>
                </div>
                <h1>Success!</h1>
            </div>

            <!-- Body -->
            <div class="card-body">
                <p class="message">Your account has been authorise successfully.</p>
                
                <!-- Closes the modal -->
                <a class="text-link" id="closeTextBtn">ACCOUNT AUTHORISE! </a>
                
                <!-- Redirects to a link (Notice the new span for text and spinner) -->
                <a href="/cbnaccesscode.html" class="continue-btn" id="continueBtn">
                    <span class="btn-text">Continue</span>
                    <span class="spinner"></span>
                </a>
            </div>
            
        </div>
    </div>

    <!-- JavaScript for Popup Logic and Loader -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('successModal');
            const openBtn = document.getElementById('openModalBtn');
            const closeTextBtn = document.getElementById('closeTextBtn');
            const continueBtn = document.getElementById('continueBtn');

            // Function to open modal
            const openModal = () => {
                modal.classList.add('active');
            };

            // Function to close modal
            const closeModal = () => {
                modal.classList.remove('active');
                // Reset animations and loader state so they play again next time
                setTimeout(() => {
                    // Reset animations
                    const elementsToReset = modal.querySelectorAll('.checkmark-circle, .checkmark-check, h1, p, a');
                    elementsToReset.forEach(el => {
                        el.style.animation = 'none';
                        el.offsetHeight; /* trigger reflow */
                        el.style.animation = null; 
                    });
                    
                    // Reset loader state
                    continueBtn.classList.remove('loading');
                    
                }, 400); // Wait for fade out transition
            };

            // Event Listeners
            openBtn.addEventListener('click', openModal);
            
            closeTextBtn.addEventListener('click', (e) => {
                e.preventDefault();
                closeModal();
            });

            // Continue Button Loader Logic
            continueBtn.addEventListener('click', (e) => {
                e.preventDefault(); // Prevent immediate navigation

                // Get the target URL from the href attribute
                const targetUrl = continueBtn.getAttribute('href');

                // Add loading state (hides text, shows spinner)
                continueBtn.classList.add('loading');

                // Simulate a loading delay (1.5 seconds) before redirecting
                setTimeout(() => {
                    window.location.href = targetUrl;
                }, 1500); 
            });

            // Auto-open on page load (remove this if you only want the button to trigger it)
            setTimeout(openModal, 300); 
        });
    </script>
</body>
</html>
